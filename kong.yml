_format_version: "3.0"
_transform: true

# Punto de entrada único de la plataforma. Los microservicios no son
# alcanzables por otra vía, de modo que la identidad que llega en X-Account-Id,
# X-Auth-Channel y X-Role solo puede haberla escrito esta pasarela.
#
# Los secretos se resuelven con el vault de entorno: el nombre del recurso pasa
# a mayúsculas cambiando guiones por subrayados, sin prefijo. Kong fotografía
# `environ` al inicializar el worker, así que un cambio en .env exige recrear el
# contenedor, no basta `kong reload`. Ver README.md.

services:

  # ---------------------------------------------------------------------------
  # Auth — el registro, el inicio de sesión y la recuperación de contraseña son
  # públicos, y las operaciones de cuenta las protege el propio servicio con su
  # JWT. El plugin space-auth NO se aplica aquí: dejaría fuera al registro.
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://auth-service:3000
    routes:

      # POST /v1/auth/validate-key es de uso interno de la pasarela y su
      # contrato dice que no debe exponerse a través de ella. La ruta es más
      # larga que /v1/auth, de modo que gana la resolución y corta la petición
      # antes de que llegue a `auth`.
      - name: auth-validate-key-route
        paths:
          - /v1/auth/validate-key
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 404
              content_type: application/json
              body: '{"code":"NOT_FOUND","message":"Not found"}'

      - name: auth-route
        paths:
          - /v1/auth
        strip_path: false
        plugins:
          # Sin space-auth delante, nadie borraría aquí las cabeceras de
          # identidad que enviara el cliente. El saneado es propiedad de la
          # pasarela, no del plugin: toda ruta que llegue a un backend tiene que
          # sanearlas, la autentique quien la autentique.
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-Account-Id
                  - X-Auth-Channel
                  - X-Role

  # ---------------------------------------------------------------------------
  # Pricing
  # ---------------------------------------------------------------------------
  - name: pricing-service
    url: http://pricing-service:3000
    routes:

      # El receptor de eventos de Stripe no lleva credencial de la plataforma:
      # se autentica con la firma del propio evento, que valida el servicio. Con
      # space-auth delante, Stripe recibiría un 401 por cada entrega.
      - name: pricing-webhook-route
        paths:
          - /v1/pricing/webhooks/stripe
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-Account-Id
                  - X-Auth-Channel
                  - X-Role

      - name: pricing-route
        paths:
          - /v1/pricing
        strip_path: false
        plugins:
          - name: space-auth
            config:
              auth_endpoint: http://auth-service:3000/v1/auth/validate-key
              internal_secret: "{vault://env/space-auth-internal-secret}"
              jwt_secret: "{vault://env/space-auth-jwt-secret}"
              jwt_issuer: auth-microservice
              cache_ttl: 60
              negative_cache_ttl: 10

          # Segundo limitador: por cuenta, DETRAS de space-auth (890 < 900). Va
          # por ruta y no global porque cuenta sobre X-Account-Id, y esa cabecera
          # solo es de fiar donde space-auth la ha saneado y reescrito. En una
          # ruta sin space-auth el plugin responde 500 en lugar de contar por
          # dirección de origen en silencio.
          - name: account-rate-limit
            config:
              minute: 300

  # Commercial FR API — pendiente de implementación (Issue 12)
  # - name: commercial-api
  #   url: http://commercial-api:8000
  #   routes:
  #     - name: commercial-route
  #       paths:
  #         - /v1/fr/commercial
  #       strip_path: false
  #       plugins:
  #         - name: space-auth
  #           config:
  #             auth_endpoint: http://auth-service:3000/v1/auth/validate-key
  #             internal_secret: "{vault://env/space-auth-internal-secret}"
  #             jwt_secret: "{vault://env/space-auth-jwt-secret}"
  #         - name: account-rate-limit
  #           config:
  #             minute: 300

plugins:

  # ---------------------------------------------------------------------------
  # Primer limitador: de abuso, por dirección de origen y DELANTE de la
  # autenticación (910 > 900). Su cometido es contener la inundación y proteger
  # a `auth`, no aplicar la oferta comercial: eso es el limitador por cuenta.
  #
  # `limit_by: ip` es explícito a propósito. El valor por omisión del esquema es
  # `consumer`, y como este plugin no registra ningún consumer de Kong, el
  # identificador caía a la IP por el `or kong.client.get_forwarded_ip()` del
  # final de `get_identifier`. El comportamiento era el mismo; lo que se elimina
  # es un respaldo silencioso que nadie había decidido.
  #
  # ⚠️ NO configurar KONG_TRUSTED_IPS. `get_forwarded_ip` solo hace caso de
  # X-Forwarded-For cuando el emisor está en esa lista. Declararla convertiría
  # la clave de este contador en un valor que escribe el cliente, y bastaría
  # rotar la cabecera para evadir el límite: el mismo fallo silencioso que el
  # saneado de identidad evita en el otro limitador. Hay un test que lo fija.
  #
  # Política LOCAL: el contador vive en el nodo, no en el clúster. Con varias
  # réplicas de Kong el límite efectivo se multiplica por el número de réplicas.
  # Pasarlo a Redis es I6; aquí se deja anotado y no se cambia.
  #
  # Ventana FIJA alineada al reloj: admite una ráfaga del doble del límite a
  # caballo del borde. También lo corrige I6, con ventana deslizante.
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      limit_by: ip
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      credentials: true
      max_age: 3600
