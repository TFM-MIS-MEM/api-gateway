_format_version: "3.0"
_transform: true

services:
  # Auth Microservice — rutas disponibles: /v1/auth/register, /v1/auth/login, /v1/auth/...
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-route
        paths:
          - /v1/auth
        strip_path: false

  # Pricing Microservice
  - name: pricing-service
    url: http://pricing-service:3000
    routes:
      - name: pricing-route
        paths:
          - /v1/pricing
        strip_path: false

  # Commercial FR API — pendiente de implementación (Issue 12)
  # - name: commercial-api
