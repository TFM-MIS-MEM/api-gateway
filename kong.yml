  #     - name: space-auth
  #       config:
  #         internal_secret: "${{env.KONG_INTERNAL_API_SECRET}}"
  #         jwt_secret: "pricing_secret_placeholder"
  #         jwt_salt: "pricing_salt_placeholder"

plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      credentials: true
      max_age: 3600
