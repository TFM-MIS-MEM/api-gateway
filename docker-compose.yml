version: '3.9'

services:
  kong:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    # Diccionario compartido del limitador por cuenta. Kong OSS no deja que un
    # plugin declare el suyo, así que se inyecta como directiva de nginx. Si
    # falta, account-rate-limit responde 500 en lugar de dejar pasar sin contar.
    #
    # ⚠️ KONG_TRUSTED_IPS se deja SIN configurar a propósito: con ella,
    # `kong.client.get_forwarded_ip()` haría caso de X-Forwarded-For y la clave
    # del limitador de abuso pasaría a escribirla el cliente. Ver kong.yml.
      KONG_PLUGINS: "bundled,space-auth,account-rate-limit"
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "account_rate_limit 12m"
    # Los secretos del plugin se resuelven con el vault de entorno de Kong
    # ({vault://env/space-auth-*}). Kong los lee de `environ` al inicializar el
    # worker: cambiarlos exige recrear el contenedor.
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - tfm-network

networks:
  tfm-network:
    driver: bridge
